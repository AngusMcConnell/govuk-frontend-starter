---
name: Handle push to `main`

"on":
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: Verify code quality
    uses: ./.github/workflows/code-quality-checks.yml

  create-release:
    name: Create release
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Create release PR
        uses: googleapis/release-please-action@v5
        with:
          release-type: node
